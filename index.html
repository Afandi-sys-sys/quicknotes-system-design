<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="QuickNotes API client">
  <title>QuickNotes System Design</title>

  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <main class="container">
    <header>
      <h1>QuickNotes</h1>
      <p>A notes application connected to a practice API.</p>
    </header>

    <section>
      <h2>Your notes</h2>

      <button id="load-btn" type="button">
        Load notes
      </button>

      <p id="status" role="status" aria-live="polite">
        Ready to load notes.
      </p>

      <ul id="notes-list"></ul>
    </section>

    <section>
      <h2>Create a note</h2>

      <form id="note-form">
        <div class="form-group">
          <label for="title-input">Note title</label>
          <input
            id="title-input"
            name="title"
            type="text"
            maxlength="100"
            required
          >
        </div>

        <div class="form-group">
          <label for="body-input">Note body (optional)</label>
          <textarea
            id="body-input"
            name="body"
            rows="4"
          ></textarea>
        </div>

        <button id="submit-btn" type="submit">
          Create note
        </button>
      </form>
    </section>
  </main>
</body>
</html>
